<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zuki Music</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #202b66, #071127);
    color: white;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
}

.player {
    background: rgba(255,255,255,0.08);
    border-radius: 25px;
    padding: 25px;
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
}

.cover {
    width: 220px;
    height: 220px;
    margin: auto;
    border-radius: 22px;
    background: linear-gradient(135deg, #6875e8, #17215a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 90px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.title {
    text-align: center;
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
}

.artist {
    text-align: center;
    margin-top: 6px;
    color: #bfc7ff;
}

.progress-container {
    margin-top: 25px;
}

input[type="range"] {
    width: 100%;
    cursor: pointer;
}

.time {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #c7cbe0;
    margin-top: 5px;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 25px;
}

button {
    border: none;
    cursor: pointer;
    color: white;
    background: rgba(255,255,255,0.12);
    border-radius: 50%;
    width: 48px;
    height: 48px;
    font-size: 18px;
}

button:hover {
    background: rgba(255,255,255,0.22);
}

.play {
    width: 65px;
    height: 65px;
    font-size: 25px;
    background: white;
    color: #18204d;
}

.play:hover {
    background: #eeeeee;
}

.extra-controls {
    display: flex;
    justify-content: center;
    margin-top: 18px;
    gap: 12px;
}

.shuffle {
    border-radius: 25px;
    width: auto;
    padding: 0 20px;
    font-size: 15px;
}

.shuffle.active {
    background: #6977ff;
    box-shadow: 0 0 15px rgba(105,119,255,0.6);
}

.status {
    text-align: center;
    font-size: 13px;
    color: #c7cbe0;
    margin-top: 12px;
    min-height: 18px;
}

.song-list {
    margin-top: 25px;
    background: rgba(0,0,0,0.15);
    border-radius: 18px;
    overflow: hidden;
}

.song-list h2 {
    font-size: 17px;
    padding: 16px;
}

.song {
    padding: 13px 16px;
    border-top: 1px solid rgba(255,255,255,0.07);
    cursor: pointer;
    display: flex;
    gap: 12px;
    align-items: center;
}

.song:hover {
    background: rgba(255,255,255,0.08);
}

.song.active {
    background: rgba(105,119,255,0.25);
}

.number {
    width: 25px;
    color: #aeb6e8;
}

.song-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.loading {
    text-align: center;
    padding: 20px;
    color: #c7cbe0;
}

@media (max-width: 500px) {
    body {
        padding: 10px;
    }

    .player {
        padding: 18px;
        border-radius: 20px;
    }

    .cover {
        width: 190px;
        height: 190px;
        font-size: 75px;
    }

    .controls {
        gap: 7px;
    }

    button {
        width: 43px;
        height: 43px;
    }

    .play {
        width: 60px;
        height: 60px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="player">

        <div class="cover">
            🎵
        </div>

        <div class="title" id="title">
            Đang tải nhạc...
        </div>

        <div class="artist">
            Zuki Music
        </div>

        <div class="progress-container">
            <input
                type="range"
                id="progress"
                min="0"
                max="100"
                value="0"
            >

            <div class="time">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">

            <button onclick="back10()">
                ↶10
            </button>

            <button onclick="previousSong()">
                ⏮
            </button>

            <button class="play" id="playButton" onclick="togglePlay()">
                ▶
            </button>

            <button onclick="nextSong()">
                ⏭
            </button>

            <button onclick="forward10()">
                ↷10
            </button>

        </div>

        <div class="extra-controls">

            <button
                class="shuffle"
                id="shuffleButton"
                onclick="toggleShuffle()"
            >
                🔀 Trộn
            </button>

        </div>

        <div class="status" id="status">
            Đang tải danh sách bài hát...
        </div>

    </div>

    <div class="song-list">

        <h2>🎵 Danh sách bài hát</h2>

        <div id="songList">
            <div class="loading">
                Đang tải...
            </div>
        </div>

    </div>

</div>

<audio id="audio"></audio>

<script>

const IDENTIFIER = "zuki_20260914";

const METADATA_URL =
    `https://archive.org/metadata/${IDENTIFIER}`;

const DOWNLOAD_URL =
    `https://archive.org/download/${IDENTIFIER}/`;

const audio = document.getElementById("audio");
const title = document.getElementById("title");
const progress = document.getElementById("progress");
const currentTimeText = document.getElementById("currentTime");
const durationText = document.getElementById("duration");
const playButton = document.getElementById("playButton");
const songList = document.getElementById("songList");
const shuffleButton = document.getElementById("shuffleButton");
const status = document.getElementById("status");

let songs = [];
let currentIndex = 0;

let shuffleEnabled = false;

/*
    Danh sách những bài đã nghe trong
    lượt trộn hiện tại.
*/
let playedSongs = [];


/* =========================
   TẢI DANH SÁCH NHẠC
========================= */

async function loadSongs() {

    try {

        const response = await fetch(METADATA_URL);

        const data = await response.json();

        songs = data.files
            .filter(file => {
                return file.name &&
                       file.name.toLowerCase().endsWith(".mp3");
            })
            .map(file => {

                return {
                    name: file.name,
                    url: DOWNLOAD_URL +
                         encodeURIComponent(file.name)
                };

            });

        if (songs.length === 0) {

            title.textContent = "Không tìm thấy bài hát";

            status.textContent =
                "Không có file MP3.";

            return;
        }

        /*
            Sắp xếp theo tên file để danh sách
            hiển thị ổn định.
        */
        songs.sort((a, b) =>
            a.name.localeCompare(b.name)
        );

        createSongList();

        playSong(0, false);

        status.textContent =
            `Đã tải ${songs.length} bài`;

    } catch (error) {

        console.error(error);

        title.textContent =
            "Không tải được danh sách";

        status.textContent =
            "Hãy kiểm tra Internet Archive.";

    }
}


/* =========================
   TẠO DANH SÁCH
========================= */

function createSongList() {

    songList.innerHTML = "";

    songs.forEach((song, index) => {

        const div = document.createElement("div");

        div.className = "song";

        div.innerHTML = `
            <div class="number">
                ${index + 1}
            </div>

            <div class="song-name">
                ${escapeHTML(
                    removeExtension(song.name)
                )}
            </div>
        `;

        div.onclick = function() {
            playSong(index, true);
        };

        songList.appendChild(div);

    });

    updateSongList();
}


/* =========================
   PHÁT BÀI
========================= */

function playSong(index, autoPlay = true) {

    if (!songs.length) return;

    if (index < 0)
        index = songs.length - 1;

    if (index >= songs.length)
        index = 0;

    currentIndex = index;

    const song = songs[currentIndex];

    audio.src = song.url;

    title.textContent =
        removeExtension(song.name);

    updateSongList();

    if (autoPlay) {

        audio.play()
            .then(() => {

                playButton.textContent = "❚❚";

            })
            .catch(error => {

                console.error(error);

                playButton.textContent = "▶";

            });

    } else {

        playButton.textContent = "▶";

    }

}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay() {

    if (!audio.src) return;

    if (audio.paused) {

        audio.play();

        playButton.textContent = "❚❚";

    } else {

        audio.pause();

        playButton.textContent = "▶";

    }

}


/* =========================
   BÀI TIẾP THEO
========================= */

function nextSong() {

    if (songs.length === 0) return;


    /*
        NẾU ĐANG BẬT TRỘN
    */

    if (shuffleEnabled) {

        /*
            Đánh dấu bài hiện tại đã nghe.
        */
        if (!playedSongs.includes(currentIndex)) {

            playedSongs.push(currentIndex);

        }


        /*
            Lấy tất cả bài chưa nghe
            trong lượt trộn hiện tại.
        */
        let availableSongs = songs
            .map((_, index) => index)
            .filter(index =>
                !playedSongs.includes(index)
            );


        /*
            Nếu đã nghe hết tất cả bài:
            reset lịch sử và bắt đầu
            một lượt trộn mới.
        */
        if (availableSongs.length === 0) {

            playedSongs = [];

            availableSongs =
                songs.map((_, index) => index);

        }


        /*
            Chọn một bài NGẪU NHIÊN.
        */
        const randomPosition =
            Math.floor(
                Math.random() *
                availableSongs.length
            );

        const nextIndex =
            availableSongs[randomPosition];


        playSong(nextIndex, true);

        return;
    }


    /*
        NẾU KHÔNG TRỘN:
        phát bài kế tiếp bình thường.
    */

    let nextIndex = currentIndex + 1;

    if (nextIndex >= songs.length) {

        nextIndex = 0;

    }

    playSong(nextIndex, true);

}


/* =========================
   BÀI TRƯỚC
========================= */

function previousSong() {

    if (!songs.length) return;

    let previousIndex =
        currentIndex - 1;

    if (previousIndex < 0) {

        previousIndex =
            songs.length - 1;

    }

    playSong(previousIndex, true);

}


/* =========================
   BẬT / TẮT TRỘN
========================= */

function toggleShuffle() {

    shuffleEnabled = !shuffleEnabled;


    if (shuffleEnabled) {

        /*
            QUAN TRỌNG:

            Mỗi lần nhấn bật Trộn,
            lịch sử bài đã nghe sẽ
            được RESET hoàn toàn.
        */
        playedSongs = [];

        shuffleButton.classList.add("active");

        status.textContent =
            "🔀 Đã bật Trộn - đã reset lịch sử";

    } else {

        shuffleButton.classList.remove("active");

        /*
            Tắt trộn cũng xóa lịch sử.
        */
        playedSongs = [];

        status.textContent =
            "Đã tắt Trộn";

    }

}


/* =========================
   TUA 10 GIÂY LÙI
========================= */

function back10() {

    audio.currentTime =
        Math.max(
            0,
            audio.currentTime - 10
        );

}


/* =========================
   TUA 10 GIÂY TIẾN
========================= */

function forward10() {

    audio.currentTime =
        Math.min(
            audio.duration || 0,
            audio.currentTime + 10
        );

}


/* =========================
   THANH TIẾN ĐỘ
========================= */

audio.addEventListener(
    "timeupdate",
    function() {

        if (!audio.duration) return;

        const percent =
            (audio.currentTime /
             audio.duration) * 100;

        progress.value = percent;

        currentTimeText.textContent =
            formatTime(audio.currentTime);

        durationText.textContent =
            formatTime(audio.duration);

    }
);


progress.addEventListener(
    "input",
    function() {

        if (!audio.duration) return;

        audio.currentTime =
            (progress.value / 100) *
            audio.duration;

    }
);


/* =========================
   KHI BÀI HẾT
========================= */

audio.addEventListener(
    "ended",
    function() {

        /*
            Nếu Trộn:
            nextSong() sẽ tự đánh dấu
            bài hiện tại và chọn bài
            ngẫu nhiên chưa nghe.
        */
        nextSong();

    }
);


/* =========================
   AUDIO ĐANG CHẠY
========================= */

audio.addEventListener(
    "play",
    function() {

        playButton.textContent = "❚❚";

    }
);


audio.addEventListener(
    "pause",
    function() {

        playButton.textContent = "▶";

    }
);


/* =========================
   CẬP NHẬT DANH SÁCH
========================= */

function updateSongList() {

    const items =
        document.querySelectorAll(".song");

    items.forEach((item, index) => {

        item.classList.toggle(
            "active",
            index === currentIndex
        );

    });

}


/* =========================
   FORMAT THỜI GIAN
========================= */

function formatTime(seconds) {

    if (!isFinite(seconds))
        return "0:00";

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return minutes + ":" +
        String(secs).padStart(2, "0");

}


/* =========================
   XÓA ĐUÔI .MP3
========================= */

function removeExtension(filename) {

    return filename
        .replace(/\.mp3$/i, "");

}


/* =========================
   CHỐNG HTML TRONG TÊN FILE
========================= */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   PHÍM TẮT TRÊN PC
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        /*
            Không xử lý phím nếu người dùng
            đang nhập vào ô input.
        */
        if (
            event.target.tagName === "INPUT" ||
            event.target.tagName === "TEXTAREA"
        ) {
            return;
        }


        /*
            Space = Play / Pause
        */
        if (event.code === "Space") {

            event.preventDefault();

            togglePlay();

        }


        /*
            ← = lùi 10 giây
        */
        if (event.key === "ArrowLeft") {

            back10();

        }


        /*
            → = tiến 10 giây
        */
        if (event.key === "ArrowRight") {

            forward10();

        }

    }
);


/* =========================
   BẮT ĐẦU
========================= */

loadSongs();

</script>

</body>
</html>
