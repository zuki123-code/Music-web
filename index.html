<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zuki Music</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #202b66, #071127);
    color: white;
    font-family: Arial, sans-serif;
}

.app {
    max-width: 520px;
    margin: auto;
    min-height: 100vh;
    padding: 25px 22px;
}

/* TOP */

.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
}

.top h2 {
    margin: 0;
    font-size: 20px;
}

.menu {
    font-size: 28px;
}

/* COVER */

.cover {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 25px;
    background:
        radial-gradient(
            circle at 50% 45%,
            #7185ff 0 8%,
            transparent 8.5%
        ),
        radial-gradient(
            circle at 50% 50%,
            #7185ff 0 22%,
            transparent 22.5%
        ),
        linear-gradient(135deg, #26366f, #121b3e);

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 25px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.3);
}

.note {
    font-size: 120px;
    opacity: .9;
}

/* SONG INFO */

.song-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.song-text {
    min-width: 0;
}

.song-title {
    font-size: 22px;
    font-weight: bold;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.artist {
    color: #aaa;
    margin-top: 8px;
}

.heart {
    font-size: 32px;
}

/* PROGRESS */

.progress-area {
    margin-top: 25px;
}

.progress {
    width: 100%;
}

.time {
    display: flex;
    justify-content: flex-end;

    color: #ddd;
    font-size: 14px;

    margin-top: 5px;
}

input[type="range"] {
    width: 100%;
    accent-color: white;
}

/* CONTROLS */

.controls {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-top: 25px;
}

.control {
    border: none;
    background: transparent;

    color: white;

    font-size: 28px;

    width: 55px;
    height: 55px;

    border-radius: 50%;
}

.control:active {
    transform: scale(.9);
}

.play {
    width: 75px;
    height: 75px;

    background: rgba(255,255,255,.1);

    font-size: 35px;
}

.skip {
    font-size: 22px;
    position: relative;
}

.skip small {
    display: block;
    font-size: 10px;
    margin-top: -3px;
}

/* EXTRA */

.extra-controls {
    display: flex;
    justify-content: space-between;

    margin-top: 25px;
}

.extra {
    border: none;
    background: transparent;

    color: #999;

    font-size: 25px;
}

.extra:active {
    transform: scale(.9);
}

.extra.active {
    color: #788cff;
}

/* STATUS */

.status {
    text-align: center;

    color: #aaa;
    font-size: 13px;

    margin: 20px 0;
}

/* SONG LIST */

.list {
    margin-top: 20px;
}

.list-title {
    font-size: 18px;
    font-weight: bold;

    margin-bottom: 10px;
}

.song-item {
    padding: 13px;

    margin-bottom: 7px;

    background: rgba(255,255,255,.06);

    border-radius: 12px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    cursor: pointer;
}

.song-item:active {
    transform: scale(.98);
}

.song-item.active {
    background: #5369e8;
}

.song-item.played {
    opacity: .45;
}

/* PC */

@media (min-width: 700px) {

    .app {
        max-width: 600px;
        padding-top: 35px;
    }

}
</style>
</head>


<body>

<div class="app">

    <!-- TOP -->

    <div class="top">

        <div style="font-size:30px;">
            ⌄
        </div>

        <h2>
            Bài hát
        </h2>

        <div class="menu">
            ⋮
        </div>

    </div>


    <!-- COVER -->

    <div class="cover">

        <div class="note">
            ♪
        </div>

    </div>


    <!-- SONG INFO -->

    <div class="song-info">

        <div class="song-text">

            <div
                class="song-title"
                id="songTitle">

                Đang tải...

            </div>

            <div class="artist">
                Zuki Music
            </div>

        </div>

        <div class="heart">
            ♡
        </div>

    </div>


    <!-- PROGRESS -->

    <div class="progress-area">

        <input
            type="range"
            id="progress"
            class="progress"
            value="0"
            min="0"
            max="100"
        >

        <div class="time">

            <span id="currentTime">
                00:00
            </span>

            &nbsp;/&nbsp;

            <span id="duration">
                00:00
            </span>

        </div>

    </div>


    <!-- AUDIO -->

    <audio id="audio"></audio>


    <!-- MAIN CONTROLS -->

    <div class="controls">


        <!-- LÙI 10 -->

        <button
            class="control skip"
            onclick="skipBackward()">

            ↶
            <small>10</small>

        </button>


        <!-- BÀI TRƯỚC -->

        <button
            class="control"
            onclick="previousSong()">

            ⏮

        </button>


        <!-- PLAY -->

        <button
            class="control play"
            onclick="togglePlay()">

            ▶

        </button>


        <!-- BÀI TIẾP -->

        <button
            class="control"
            onclick="nextSong()">

            ⏭

        </button>


        <!-- TIẾN 10 -->

        <button
            class="control skip"
            onclick="skipForward()">

            ↷
            <small>10</small>

        </button>

    </div>


    <!-- EXTRA CONTROLS -->

    <div class="extra-controls">


        <!-- SHUFFLE -->

        <button
            id="shuffleButton"
            class="extra"
            onclick="toggleShuffle()">

            🔀

        </button>


        <button
            class="extra"
            onclick="previousSong()">

            ☷

        </button>


        <button
            class="extra"
            onclick="showList()">

            ☰

        </button>

    </div>


    <!-- STATUS -->

    <div
        class="status"
        id="status">

        Đang tải danh sách nhạc...

    </div>


    <!-- SONG LIST -->

    <div
        class="list"
        id="songList">

        <div class="list-title">
            Danh sách bài hát
        </div>

    </div>

</div>


<script>

/* =====================================
   INTERNET ARCHIVE
===================================== */

const ARCHIVE_ID =
    "zuki_20260914";


/* =====================================
   ELEMENTS
===================================== */

const audio =
    document.getElementById("audio");

const title =
    document.getElementById("songTitle");

const progress =
    document.getElementById("progress");

const currentTimeText =
    document.getElementById("currentTime");

const durationText =
    document.getElementById("duration");

const status =
    document.getElementById("status");

const songList =
    document.getElementById("songList");

const playButton =
    document.querySelector(".play");

const shuffleButton =
    document.getElementById("shuffleButton");


/* =====================================
   VARIABLES
===================================== */

let songs = [];

let currentIndex = 0;

let shuffleEnabled = false;

/*
    Danh sách các bài đã phát
    trong vòng trộn hiện tại.
*/

let playedSongs = [];


/* =====================================
   TẢI DANH SÁCH NHẠC
===================================== */

async function loadSongs() {

    try {

        const response =
            await fetch(
                "https://archive.org/metadata/"
                + ARCHIVE_ID
            );


        const data =
            await response.json();


        const baseURL =
            "https://archive.org/download/"
            + ARCHIVE_ID
            + "/";


        songs = data.files

            .filter(file =>
                file.name &&
                file.name
                    .toLowerCase()
                    .endsWith(".mp3")
            )

            .map(file => ({

                name:
                    file.name
                        .replace(/\.mp3$/i, ""),

                url:
                    baseURL
                    + encodeURIComponent(file.name)

            }));


        if (songs.length === 0) {

            status.textContent =
                "Không tìm thấy file MP3.";

            return;

        }


        status.textContent =
            "Đã tải "
            + songs.length
            + " bài";


        createSongList();


        /*
            Chọn bài đầu tiên
            nhưng chưa tự phát.
        */

        playSong(0, false);


    } catch (error) {

        console.error(error);

        status.textContent =
            "Không thể tải danh sách nhạc.";

    }

}


/* =====================================
   TẠO DANH SÁCH
===================================== */

function createSongList() {

    songList.innerHTML =
        '<div class="list-title">'
        + 'Danh sách bài hát'
        + '</div>';


    songs.forEach((song, index) => {

        const item =
            document.createElement("div");


        item.className =
            "song-item";


        item.textContent =
            (index + 1)
            + ". "
            + song.name;


        item.onclick =
            function() {

                playSong(index, true);

            };


        songList.appendChild(item);

    });

}


/* =====================================
   PHÁT BÀI
===================================== */

function playSong(
    index,
    autoplay = true
) {

    if (!songs[index]) return;


    currentIndex =
        index;


    audio.src =
        songs[index].url;


    title.textContent =
        songs[index].name;


    updateSongList();


    if (autoplay) {

        audio.play()
            .then(() => {

                playButton.textContent =
                    "❚❚";

            })
            .catch(() => {});

    }

}


/* =====================================
   PLAY / PAUSE
===================================== */

function togglePlay() {

    if (!audio.src) return;


    if (audio.paused) {

        audio.play();

        playButton.textContent =
            "❚❚";

    } else {

        audio.pause();

        playButton.textContent =
            "▶";

    }

}


/* =====================================
   LÙI 10 GIÂY
===================================== */

function skipBackward() {

    audio.currentTime =
        Math.max(
            0,
            audio.currentTime - 10
        );

}


/* =====================================
   TIẾN 10 GIÂY
===================================== */

function skipForward() {

    audio.currentTime =
        Math.min(
            audio.duration || 0,
            audio.currentTime + 10
        );

}


/* =====================================
   BÀI TRƯỚC
===================================== */

function previousSong() {

    if (songs.length === 0) return;


    let index =
        currentIndex - 1;


    if (index < 0) {

        index =
            songs.length - 1;

    }


    playSong(index, true);

}


/* =====================================
   BÀI TIẾP
===================================== */

function nextSong() {

    if (songs.length === 0) return;


    /* ================================
       CHẾ ĐỘ TRỘN
    ================================= */

    if (shuffleEnabled) {


        /*
            Đánh dấu bài hiện tại
            đã được phát.
        */

        if (
            !playedSongs.includes(
                currentIndex
            )
        ) {

            playedSongs.push(
                currentIndex
            );

        }


        /*
            Tạo danh sách
            những bài CHƯA phát.
        */

        let available = [];


        for (
            let i = 0;
            i < songs.length;
            i++
        ) {

            if (
                !playedSongs.includes(i)
            ) {

                available.push(i);

            }

        }


        /*
            Nếu đã nghe hết tất cả
            thì bắt đầu vòng mới.
        */

        if (
            available.length === 0
        ) {

            /*
                Giữ bài hiện tại
                là bài đã phát.
            */

            playedSongs = [
                currentIndex
            ];


            /*
                Các bài còn lại
                trở thành danh sách mới.
            */

            for (
                let i = 0;
                i < songs.length;
                i++
            ) {

                if (
                    i !== currentIndex
                ) {

                    available.push(i);

                }

            }

        }


        /*
            Chọn ngẫu nhiên
            một bài chưa phát.
        */

        const randomPosition =
            Math.floor(
                Math.random()
                * available.length
            );


        const nextIndex =
            available[
                randomPosition
            ];


        playSong(
            nextIndex,
            true
        );

    }


    /* ================================
       TRỘN TẮT
    ================================= */

    else {

        let index =
            currentIndex + 1;


        if (
            index >= songs.length
        ) {

            index = 0;

        }


        playSong(
            index,
            true
        );

    }

}


/* =====================================
   BẬT / TẮT TRỘN
===================================== */

function toggleShuffle() {

    shuffleEnabled =
        !shuffleEnabled;


    if (shuffleEnabled) {


        /*
            Nút 🔀 sáng lên.
        */

        shuffleButton
            .classList
            .add("active");


        /*
            Bài hiện tại được tính
            là bài đã phát.
        */

        playedSongs = [
            currentIndex
        ];


        status.textContent =
            "🔀 Đã bật trộn";


    } else {


        shuffleButton
            .classList
            .remove("active");


        status.textContent =
            "Đã tắt trộn";

    }


    updateSongList();

}


/* =====================================
   TỰ ĐỘNG SANG BÀI
===================================== */

audio.addEventListener(
    "ended",
    function() {

        nextSong();

    }
);


/* =====================================
   PLAY / PAUSE EVENT
===================================== */

audio.addEventListener(
    "play",
    function() {

        playButton.textContent =
            "❚❚";

    }
);


audio.addEventListener(
    "pause",
    function() {

        playButton.textContent =
            "▶";

    }
);


/* =====================================
   THANH TIẾN TRÌNH
===================================== */

audio.addEventListener(
    "timeupdate",
    function() {

        if (!audio.duration) return;


        progress.value =
            (
                audio.currentTime
                /
                audio.duration
            ) * 100;


        currentTimeText.textContent =
            formatTime(
                audio.currentTime
            );


        durationText.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =====================================
   KÉO THANH TIẾN TRÌNH
===================================== */

progress.addEventListener(
    "input",
    function() {

        if (!audio.duration) return;


        audio.currentTime =
            (
                progress.value / 100
            )
            * audio.duration;

    }
);


/* =====================================
   PHÍM PC
===================================== */

document.addEventListener(
    "keydown",
    function(event) {


        /*
            ← = lùi 10 giây
        */

        if (
            event.key === "ArrowLeft"
        ) {

            event.preventDefault();

            skipBackward();

        }


        /*
            → = tiến 10 giây
        */

        if (
            event.key === "ArrowRight"
        ) {

            event.preventDefault();

            skipForward();

        }


        /*
            SPACE = Play / Pause
        */

        if (
            event.code === "Space"
        ) {

            /*
                Không làm trang
                cuộn lên/xuống.
            */

            event.preventDefault();

            togglePlay();

        }

    }
);


/* =====================================
   FORMAT THỜI GIAN
===================================== */

function formatTime(seconds) {

    if (
        isNaN(seconds)
    ) {

        return "00:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        String(minutes)
            .padStart(2, "0")
        + ":"
        +
        String(secs)
            .padStart(2, "0")
    );

}


/* =====================================
   CẬP NHẬT DANH SÁCH
===================================== */

function updateSongList() {

    const items =
        document.querySelectorAll(
            ".song-item"
        );


    items.forEach(
        (item, index) => {


            /*
                Bài đang phát
            */

            item.classList.toggle(
                "active",
                index === currentIndex
            );


            /*
                Bài đã phát
                trong chế độ trộn
            */

            item.classList.toggle(
                "played",
                shuffleEnabled
                &&
                playedSongs.includes(index)
                &&
                index !== currentIndex
            );

        }
    );

}


/* =====================================
   CUỘN TỚI DANH SÁCH
===================================== */

function showList() {

    songList.scrollIntoView({
        behavior: "smooth"
    });

}


/* =====================================
   CẬP NHẬT ĐỊNH KỲ
===================================== */

setInterval(
    updateSongList,
    500
);


/* =====================================
   BẮT ĐẦU
===================================== */

loadSongs();

</script>

</body>
    </html>
