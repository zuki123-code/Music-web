<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zuki Music</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

#status {
    text-align: center;
    color: #aaa;
    margin-bottom: 20px;
}

.player {
    background: #1e1e1e;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
}

#songName {
    text-align: center;
    font-size: 18px;
    margin-bottom: 15px;
    word-break: break-word;
}

audio {
    width: 100%;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 15px;
}

button:active {
    transform: scale(0.97);
}

.random {
    background: #6c35ff;
}

#list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.song {
    background: #1e1e1e;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    word-break: break-word;
}

.song.active {
    background: #6c35ff;
}
</style>
</head>

<body>

<div class="container">

<h1>🎵 Zuki Music</h1>

<div id="status">Đang tải danh sách nhạc...</div>

<div class="player">

<div id="songName">Chưa chọn bài</div>

<audio id="audio" controls></audio>

<div class="buttons">
<button onclick="previousSong()">⏮ Trước</button>
<button class="random" onclick="randomSong()">🔀 Ngẫu nhiên</button>
<button onclick="nextSong()">Tiếp ⏭</button>
</div>

</div>

<div id="list"></div>

</div>

<script>

const IDENTIFIER = "zuki_20260914";

const audio = document.getElementById("audio");
const songName = document.getElementById("songName");
const list = document.getElementById("list");
const statusText = document.getElementById("status");

let songs = [];
let current = 0;


// Lấy danh sách file từ Internet Archive
async function loadSongs() {

    try {

        const response = await fetch(
            `https://archive.org/metadata/${IDENTIFIER}`
        );

        const data = await response.json();

        const base =
            `https://archive.org/download/${IDENTIFIER}/`;

        songs = data.files
            .filter(file =>
                file.name &&
                file.name.toLowerCase().endsWith(".mp3")
            )
            .map(file => ({
                name: file.name.replace(/\.mp3$/i, ""),
                url: base + encodeURIComponent(file.name)
            }));

        if (songs.length === 0) {
            statusText.textContent = "Không tìm thấy file MP3.";
            return;
        }

        statusText.textContent =
            `Đã tải ${songs.length} bài nhạc`;

        createList();

        playSong(0);

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Không tải được danh sách nhạc.";

    }
}


// Tạo danh sách bài hát
function createList() {

    list.innerHTML = "";

    songs.forEach((song, index) => {

        const div = document.createElement("div");

        div.className = "song";

        div.textContent =
            `${index + 1}. ${song.name}`;

        div.onclick = () => {
            playSong(index);
        };

        list.appendChild(div);

    });
}


// Phát bài
function playSong(index) {

    if (!songs[index]) return;

    current = index;

    audio.src = songs[index].url;

    songName.textContent = songs[index].name;

    audio.play().catch(() => {});

    updateList();

}


// Đánh dấu bài đang phát
function updateList() {

    document.querySelectorAll(".song")
        .forEach((element, index) => {

            element.classList.toggle(
                "active",
                index === current
            );

        });

}


// Bài trước
function previousSong() {

    current--;

    if (current < 0) {
        current = songs.length - 1;
    }

    playSong(current);

}


// Bài tiếp
function nextSong() {

    current++;

    if (current >= songs.length) {
        current = 0;
    }

    playSong(current);

}


// Bài ngẫu nhiên
function randomSong() {

    if (songs.length <= 1) return;

    let random;

    do {
        random =
            Math.floor(Math.random() * songs.length);
    }
    while (random === current);

    playSong(random);

}


// Khi bài hát kết thúc → tự sang bài khác
audio.addEventListener("ended", () => {

    nextSong();

});


loadSongs();

</script>

</body>
  </html>
